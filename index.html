<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Endurance Analytics</title>

https://cdn.jsdelivr.net/npm/chart.jsscript>

<style>

:root{
--bg:#f4f7fb;
--card:#ffffff;
--text:#1f2937;
--blue:#2563eb;
--green:#10b981;
--orange:#f59e0b;
--purple:#8b5cf6;
--shadow:0 4px 20px rgba(0,0,0,.08);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:var(--bg);
padding:20px;
color:var(--text);
}

h1{
margin-bottom:5px;
}

.subtitle{
color:#666;
margin-bottom:20px;
}

.kpis{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.kpi{
padding:20px;
border-radius:15px;
color:white;
}

.blue{background:#2563eb;}
.green{background:#10b981;}
.orange{background:#f59e0b;}
.purple{background:#8b5cf6;}

.value{
font-size:2rem;
font-weight:bold;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:var(--shadow);
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

input,select{
padding:10px;
border:1px solid #ddd;
border-radius:8px;
width:100%;
}

.form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-top:15px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#f3f4f6;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<h1>🏃 Endurance Analytics</h1>
<div class="subtitle">
Dashboard de Running · Bike · Swim
</div>

<div class="kpis">

<div class="kpi blue">
<div>Distancia Total</div>
<div class="value" id="km">0 km</div>
</div>

<div class="kpi green">
<div>Horas Totales</div>
<div class="value" id="hours">0 h</div>
</div>

<div class="kpi orange">
<div>Carga Total</div>
<div class="value" id="load">0</div>
</div>

<div class="kpi purple">
<div>Sesiones</div>
<div class="value" id="sessions">0</div>
</div>

</div>

<div class="card">

<h2>Agregar entrenamiento</h2>

<div class="form">

<input type="date" id="date">

<select id="sport">
<option>Running</option>
<option>Bike</option>
<option>Swim</option>
</select>

<input type="number" id="distance" placeholder="Km">

<input type="number" id="duration" placeholder="Minutos">

<input type="number" id="rpe" placeholder="RPE">

<button onclick="addWorkout()">
Guardar
</button>

</div>

</div>

<div class="grid">

<div class="card">
<h3>Evolución de carga</h3>
<canvas id="volumeChart"></canvas>
</div>

<div class="card">
<h3>Distribución</h3>
<canvas id="sportChart"></canvas>
</div>

</div>

<div class="card">

<h2>Entrenamientos</h2>

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Deporte</th>
<th>Km</th>
<th>Min</th>
<th>Carga</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>

<script>

let workouts =
JSON.parse(localStorage.getItem("workouts")) || [];

let chart1=null;
let chart2=null;

function save(){
localStorage.setItem(
"workouts",
JSON.stringify(workouts)
);
}

function addWorkout(){

const workout = {

date:
document.getElementById("date").value,

sport:
document.getElementById("sport").value,

distance:
Number(document.getElementById("distance").value),

duration:
Number(document.getElementById("duration").value),

rpe:
Number(document.getElementById("rpe").value)

};

workout.load =
workout.duration * workout.rpe;

workouts.push(workout);

save();

render();

}

function render(){

let totalKm=0;
let totalMin=0;
let totalLoad=0;

const tbody=
document.getElementById("tableBody");

tbody.innerHTML="";

workouts.forEach(w=>{

totalKm+=w.distance;
totalMin+=w.duration;
totalLoad+=w.load;

tbody.innerHTML+=`
<tr>
<td>${w.date}</td>
<td>${w.sport}</td>
<td>${w.distance}</td>
<td>${w.duration}</td>
<td>${w.load}</td>
</tr>
`;

});

document.getElementById("km")
.innerHTML = totalKm.toFixed(1)+" km";

document.getElementById("hours")
.innerHTML = (totalMin/60).toFixed(1)+" h";

document.getElementById("load")
.innerHTML = totalLoad;

document.getElementById("sessions")
.innerHTML = workouts.length;

drawCharts();

}

function drawCharts(){

const labels=
workouts.map((w,i)=>"Entr "+(i+1));

const loads=
workouts.map(w=>w.load);

if(chart1){
chart1.destroy();
}

chart1=new Chart(
document.getElementById("volumeChart"),
{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Carga",
data:loads,
borderColor:"#2563eb",
backgroundColor:"#93c5fd",
fill:false
}]
}
});

const running=
workouts.filter(x=>x.sport==="Running").length;

const bike=
workouts.filter(x=>x.sport==="Bike").length;

const swim=
workouts.filter(x=>x.sport==="Swim").length;

if(chart2){
chart2.destroy();
}

chart2=new Chart(
document.getElementById("sportChart"),
{
type:"doughnut",
data:{
labels:["Running","Bike","Swim"],
datasets:[{
data:[running,bike,swim],
backgroundColor:[
"#10b981",
"#f59e0b",
"#3b82f6"
]
}]
}
});

}

render();

</script>

</body>
</html>
