<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Endurance Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Segoe UI,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

h1{
font-size:3rem;
margin-bottom:10px;
}

.subtitle{
color:#94a3b8;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.25);
}

.card h3{
color:#94a3b8;
margin-bottom:10px;
}

.metric{
font-size:2rem;
font-weight:bold;
}

.form{
background:#1e293b;
padding:25px;
border-radius:20px;
margin-bottom:30px;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#334155;
color:white;
}

button{
background:#3b82f6;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#2563eb;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#334155;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #334155;
}

.running{
color:#4ade80;
}

.bike{
color:#f59e0b;
}

.swim{
color:#38bdf8;
}

</style>
</head>
<body>

<h1>🏊🚴🏃 Endurance Dashboard</h1>
<p class="subtitle">Federico Aramburu Training Center</p>

<div class="grid">

<div class="card">
<h3>Distancia Total</h3>
<div class="metric" id="totalKm">0 km</div>
</div>

<div class="card">
<h3>Tiempo Total</h3>
<div class="metric" id="totalMin">0 min</div>
</div>

<div class="card">
<h3>Carga Total</h3>
<div class="metric" id="totalLoad">0</div>
</div>

<div class="card">
<h3>Entrenamientos</h3>
<div class="metric" id="totalSessions">0</div>
</div>

</div>

<div class="form">

<h2>Agregar entrenamiento</h2>

<input type="date" id="date">

<select id="sport">
<option>Running</option>
<option>Bike</option>
<option>Swim</option>
</select>

<input type="number" id="distance" placeholder="Distancia (km)">

<input type="number" id="duration" placeholder="Duración (min)">

<input type="number" id="rpe" min="1" max="10" placeholder="RPE (1-10)">

<button onclick="addWorkout()">Agregar</button>

</div>

<div class="card">

<h2>Entrenamientos</h2>
<br>

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Deporte</th>
<th>Km</th>
<th>Min</th>
<th>Carga</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

let workouts = JSON.parse(localStorage.getItem("workouts")) || [];

function save(){
localStorage.setItem("workouts",JSON.stringify(workouts));
}

function addWorkout(){

let workout={
date:document.getElementById("date").value,
sport:document.getElementById("sport").value,
distance:Number(document.getElementById("distance").value),
duration:Number(document.getElementById("duration").value),
rpe:Number(document.getElementById("rpe").value)
};

workout.load = workout.duration * workout.rpe;

workouts.push(workout);

save();

render();

}

function render(){

let body=document.getElementById("tableBody");

body.innerHTML="";

let km=0;
let min=0;
let load=0;

workouts.forEach(w=>{

km+=w.distance;
min+=w.duration;
load+=w.load;

let color="";

if(w.sport==="Running") color="running";
if(w.sport==="Bike") color="bike";
if(w.sport==="Swim") color="swim";

body.innerHTML += `
<tr>
<td>${w.date}</td>
<td class="${color}">${w.sport}</td>
<td>${w.distance}</td>
<td>${w.duration}</td>
<td>${w.load}</td>
</tr>
`;

});

document.getElementById("totalKm").innerHTML =
km.toFixed(1)+" km";

document.getElementById("totalMin").innerHTML =
min+" min";

document.getElementById("totalLoad").innerHTML =
load;

document.getElementById("totalSessions").innerHTML =
workouts.length;

}

render();

</script>

</body>
</html>
