<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Endurance Analytics</title>

<script src="httpsvr.net/npm/chart.jsscript>

<style>

:root{
 --bg:#f4f7fb;
 --card:#ffffff;
 --text:#1f2937;
 --blue:#2563eb;
 --green:#10b981;
 --orange:#f59e0b;
 --purple:#8b5cf6;
 --red:#ef4444;
 --shadow:0 4px 20px rgba(0,0,0,.08);
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 font-family:Segoe UI,Arial,sans-serif;
}

body{
 background:var(--bg);
 color:var(--text);
 padding:20px;
}

h1{
 margin-bottom:5px;
}

.subtitle{
 color:#6b7280;
 margin-bottom:20px;
}

.kpis{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
 gap:15px;
 margin-bottom:20px;
}

.kpi{
 color:white;
 padding:20px;
 border-radius:12px;
 box-shadow:var(--shadow);
}

.kpi h3{
 font-size:.9rem;
 opacity:.9;
}

.kpi .value{
 font-size:2rem;
 font-weight:bold;
 margin-top:10px;
}

.blue{background:var(--blue);}
.green{background:var(--green);}
.orange{background:var(--orange);}
.purple{background:var(--purple);}
.red{background:var(--red);}

.grid{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:20px;
 margin-bottom:20px;
}

.card{
 background:var(--card);
 padding:20px;
 border-radius:12px;
 box-shadow:var(--shadow);
}

.form-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:10px;
 margin-top:15px;
}

input,select{
 padding:10px;
 border:1px solid #ddd;
 border-radius:8px;
}

button{
 background:var(--blue);
 color:white;
 border:none;
 padding:12px;
 border-radius:8px;
 cursor:pointer;
}

button:hover{
 opacity:.9;
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:10px;
}

th{
 background:#e5e7eb;
}

th,td{
 padding:10px;
 text-align:center;
 border-bottom:1px solid #eee;
}

.heatmap{
 display:grid;
 grid-template-columns:repeat(20,18px);
 gap:4px;
 margin-top:15px;
}

.day{
 width:18px;
 height:18px;
 background:#e5e7eb;
 border-radius:3px;
}

.active{
 background:#10b981;
}

.predictions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin-top:15px;
}

.pred{
 background:#eef2ff;
 padding:15px;
 border-radius:10px;
 text-align:center;
}

@media(max-width:900px){
 .grid{
   grid-template-columns:1fr;
 }
 .predictions{
   grid-template-columns:1fr 1fr;
 }
}

</style>
</head>
<body>

<h1>🏃 Endurance Analytics</h1>
<div class="subtitle">Running · Bike · Swim</div>

<div class="kpis">

<div class="kpi blue">
<h3>Distancia Total</h3>
<div class="value" id="km">0</div>
</div>

<div class="kpi green">
<h3>Horas Totales</h3>
<div class="value" id="hours">0</div>
</div>

<div class="kpi orange">
<h3>Carga (ATL)</h3>
<div class="value" id="atl">0</div>
</div>

<div class="kpi purple">
<h3>Fitness (CTL)</h3>
<div class="value" id="ctl">0</div>
</div>

<div class="kpi red">
<h3>Forma (TSB)</h3>
<div class="value" id="tsb">0</div>
</div>

</div>

<div class="card">

<h2>Cargar entrenamiento</h2>

<div class="form-grid">

<input type="date" id="date">

<select id="sport">
<option>Running</option>
<option>Bike</option>
<option>Swim</option>
</select>

<input type="number" id="distance" placeholder="Km">

<input type="number" id="duration" placeholder="Minutos">

<input type="number" id="rpe" placeholder="RPE 1-10">

<button onclick="addWorkout()">Guardar</button>

</div>

</div>

<br>

<div class="grid">

<div class="card">
<h3>Volumen por sesión</h3>
<canvas id="volumeChart"></canvas>
</div>

<div class="card">
<h3>Distribución</h3>
<canvas id="sportChart"></canvas>
</div>

</div>

<div class="grid">

<div class="card">
<h3>Predicción de carrera</h3>

<div class="predictions">

<div class="pred">
<h4>5K</h4>
<div id="p5">--</div>
</div>

<div class="pred">
<h4>10K</h4>
<div id="p10">--</div>
</div>

<div class="pred">
<h4>21K</h4>
<div id="p21">--</div>
</div>

<div class="pred">
<h4>42K</h4>
<div id="p42">--</div>
</div>

</div>

</div>

<div class="card">

<h3>Heatmap</h3>

<div id="heatmap" class="heatmap"></div>

</div>

</div>

<div class="card">

<h2>Entrenamientos</h2>

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Deporte</th>
<th>Km</th>
<th>Min</th>
<th>Carga</th>
</tr>
</thead>

<tbody id="body"></tbody>

</table>

</div>

<script>

let workouts =
JSON.parse(localStorage.getItem("workouts")) || [];

let volumeChart;
let sportChart;

function save(){
localStorage.setItem(
"workouts",
JSON.stringify(workouts)
);
}

function addWorkout(){

let w = {

date:
document.getElementById("date").value,

sport:
document.getElementById("sport").value,

distance:
Number(document.getElementById("distance").value),

duration:
Number(document.getElementById("duration").value),

rpe:
Number(document.getElementById("rpe").value)

};

w.load = w.duration * w.rpe;

workouts.push(w);

save();

render();

}

function formatTime(min){

let h=Math.floor(min/60);

let m=Math.round(min%60);

return h+"h "+m+"m";

}

function predict(baseKm,baseTime,targetKm){

return baseTime *
Math.pow(targetKm/baseKm,1.06);

}

function renderPredictions(){

let runs=
workouts.filter(x=>x.sport==="Running");

if(runs.length===0) return;

let best=runs[runs.length-1];

let km=best.distance;
let time=best.duration;

document.getElementById("p5").innerHTML=
Math.round(predict(km,time,5))+" min";

document.getElementById("p10").innerHTML=
Math.round(predict(km,time,10))+" min";

document.getElementById("p21").innerHTML=
Math.round(predict(km,time,21.1))+" min";

document.getElementById("p42").innerHTML=
Math.round(predict(km,time,42.2))+" min";

}

function renderHeatmap(){

let div=document.getElementById("heatmap");

div.innerHTML="";

for(let i=0;i<120;i++){

let box=document.createElement("div");

box.className="day";

if(i<workouts.length){
box.classList.add("active");
}

div.appendChild(box);
}

}

function render(){

let km=0;
let min=0;
let load=0;

let body=document.getElementById("body");

body.innerHTML="";

workouts.forEach(w=>{

km+=w.distance;
min+=w.duration;
load+=w.load;

body.innerHTML+=`
<tr>
<td>${w.date}</td>
<td>${w.sport}</td>
<td>${w.distance}</td>
<td>${w.duration}</td>
<td>${w.load}</td>
</tr>
`;

});

let ctl=Math.round(load*0.70);
let atl=Math.round(load);
let tsb=ctl-atl;

document.getElementById("km").innerHTML=
km.toFixed(1)+" km";

document.getElementById("hours").innerHTML=
(min/60).toFixed(1);

document.getElementById("atl").innerHTML=
atl;

document.getElementById("ctl").innerHTML=
ctl;

document.getElementById("tsb").innerHTML=
tsb;

renderCharts();
renderPredictions();
renderHeatmap();

}

function renderCharts(){

let labels=
workouts.map((x,i)=>"S"+(i+1));

let loads=
workouts.map(x=>x.load);

if(volumeChart) volumeChart.destroy();

volumeChart=
new Chart(
document.getElementById("volumeChart"),
{
type:"line",
data:{
labels,
datasets:[
{
label:"Carga",
data:loads,
borderColor:"#2563eb",
backgroundColor:"#93c5fd"
}
]
}
}
);

let running=
workouts.filter(x=>x.sport==="Running").length;

let bike=
workouts.filter(x=>x.sport==="Bike").length;

let swim=
workouts.filter(x=>x.sport==="Swim").length;

if(sportChart) sportChart.destroy();

sportChart=
new Chart(
document.getElementById("sportChart"),
{
type:"doughnut",
data:{
labels:[
"Running",
"Bike",
"Swim"
],
datasets:[
{
data:[
running,
bike,
swim
],
backgroundColor:[
"#10b981",
"#f59e0b",
"#3b82f6"
]
}
]
}
}
);

}

render();

</script>

</body>
</html>
